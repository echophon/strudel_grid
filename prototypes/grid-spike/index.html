<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE grid spike</title>
  <style>
    :root { --bg: #111; --fg: #ddd; --dim: #777; --accent: #fc6; }
    body { background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, Menlo, monospace; margin: 16px; }
    h1 { font-size: 14px; color: var(--accent); }
    #grid { display: grid; grid-template-columns: repeat(16, 32px); gap: 4px; margin: 12px 0; user-select: none; }
    #grid div { width: 32px; height: 32px; border-radius: 4px; background: #222; cursor: pointer; }
    textarea { width: min(100%, 720px); height: 300px; background: #1a1a1a; color: var(--fg); border: 1px solid #333; font: inherit; padding: 8px; }
    button { font: inherit; padding: 6px 12px; margin-right: 8px; }
    #log { color: var(--dim); white-space: pre-wrap; margin-top: 8px; max-height: 220px; overflow: auto; }
    label { color: var(--dim); }
  </style>
</head>
<body>
  <h1>PROTOTYPE — grid spike: tagged-hap flashes over WebSerial (throwaway)</h1>
  <div>
    <button id="connect">Connect grid</button>
    <button id="play">Play (Ctrl+Enter)</button>
    <button id="stop">Stop (Ctrl+.)</button>
    <label>latency nudge ms <input id="nudge" type="number" value="0" step="5" style="width:60px" /></label>
  </div>
  <div id="grid"></div>
  <textarea id="code" spellcheck="false">// Everything on the grid is declared here — re-carve the layout and Ctrl+Enter.
// State persists by id across evals.  tap = latch · hold > 300ms = momentary (switches)
setcps(0.5)
const kick  = grid.toggles({ id:'kick',  y:0, init:'x...x...x...x.x.' })
const snare = grid.toggles({ id:'snare', y:1, init:'....x.......x..x' })
// pitch matrix: column = step, row = scale degree (bottom row = 0, dim), tap lit cell = rest
const mel   = grid.notes({ id:'mel', y:2, h:5, init:'0..2..3.4...2.1.' })
// melody transforms act on DEGREES, before the scale is applied
const mfx = grid.switches({ id:'mfx', y:7, q:1, fns: [
  x=>x.add(7), x=>x.add(2), rev, x=>x.ply(2), x=>x.fast(2),
  x=>x.degradeBy(.3), x=>x.palindrome(), x=>x.off(1/8, y=>y.add(4)) ]})
stack(
  s("bd").struct(kick).bank("tr909"),
  s("sd").struct(snare).bank("tr909").gain(.8),
  n(mel.sw(mfx.all)).scale("C:minor").s("sawtooth")
    .lpf(1200).lpq(6).decay(.15).sustain(0).gain(.6),
)
// try: poly:true for chords · .scale("D:dorian") · n(mel.add(-7)) for a bass line
// · a second notes() widget elsewhere · grid.switches for rhythm fx on row 7 cols 8-15</textarea>
  <pre id="legend" style="color:var(--dim)"></pre>
  <div id="log"></div>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
