<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>strudel grid</title>
  </head>
  <body>
    <header>
      <h1>strudel <span>×</span> grid</h1>
      <div class="controls">
        <button id="connect">Connect grid</button>
        <button id="play" title="Ctrl+Enter">▶ Run</button>
        <button id="stop" title="Ctrl+.">■ Stop</button>
        <button id="capture" title="Ctrl+Shift+Enter — write the grid's state into the code's init: options">⤓ Capture</button>
        <span class="file">
          <select id="examples" title="Load an example project (replaces the editor's code and the grid state)">
            <option value="">examples…</option>
          </select>
          <button id="open" title="Load a .js / .txt file from disk (or drop one on the editor)">Open…</button>
          <button id="save" title="Download the editor's code as a .js file">Save</button>
          <input id="file" type="file" accept=".js,.mjs,.txt,.strudel,text/*" hidden />
        </span>
        <span id="status">stopped</span>
        <label>nudge <input id="nudge" type="number" step="5" value="0" /> ms</label>
        <button id="reset" class="ghost" title="Forget saved code and grid state">reset</button>
      </div>
    </header>
    <main>
      <section class="left">
        <div id="editor"></div>
      </section>
      <aside class="right">
        <nav class="tabs"><span class="lbl">pages</span><span id="pages"></span></nav>
        <div id="vgrid"></div>
        <div id="legend"></div>
        <div id="log"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
